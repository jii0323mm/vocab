# 產生離線字典 dict/*.json，產生後自動 commit 回 main
name: build-dict
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_dict.py', '.github/workflows/build-dict.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - name: 下載來源字典並產生
        run: |
          curl -fsSL -o /tmp/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/39cfb9672c0906b63569e0453c2e6abfb9ab182a/ecdict.csv
          curl -fsSL -o /tmp/cmudict.dict https://raw.githubusercontent.com/cmusphinx/cmudict/74790861f652b15e4ac49015a90074ad62a27690/cmudict.dict
          python tools/build_dict.py /tmp/ecdict.csv /tmp/cmudict.dict dict
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dict
          git diff --cached --quiet && exit 0
          git commit -m "產生離線字典"
          git push
